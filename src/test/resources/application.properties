spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.autoconfigure.exclude=com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure

spring.jpa.database-platform=org.eclipse.persistence.platform.database.H2Platform
spring.jpa.generate-ddl=false
spring.jpa.properties.eclipselink.ddl-generation=none
spring.jpa.properties.eclipselink.ddl-generation.output-mode=none
spring.jpa.properties.eclipselink.weaving=false
jakarta.persistence.schema-generation.database.action=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test
minio.bucket=test-bucket

cache.stats.logging-enabled=false

# scheduler recovery placeholders for tests
jobs.import-recovery.stale-duration=PT10M
jobs.import-recovery.delay-ms=300000
default-lock-at-most-for=PT1M
