version: '3.8'
services:
  pg:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DB_USER}
      POSTGRES_USER: ${DB_PASS}
      POSTGRES_PASSWORD: ${DB_NAME}
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  pgdata:
  minio-data:
